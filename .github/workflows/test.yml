name: Test

on:
  push:
    branches:
      - 'master'

jobs:
  test:
    runs-on:  ubuntu-26.04

    steps:
    - uses: actions/checkout@v7

    - name: Setup uv
      uses: astral-sh/setup-uv@v9.0.0

    - name: Install cargo
      run: |
        sudo apt update
        sudo apt install --yes cargo

    - name: Install alpm-srcinfo
      run: |
        cargo install alpm-srcinfo --features cli

    - name: Install dependencies
      run: uv sync --frozen

    - name: Lint
      run: uv run --no-sync ruff check

    - name: Typing
      run: uv run --no-sync mypy

    - name: Test
      run: uv run --no-sync pytest
